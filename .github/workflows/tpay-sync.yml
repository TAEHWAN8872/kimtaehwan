name: tpay 매출 데이터 동기화
on:
  schedule:
    - cron: '0 18 * * *'   # 매일 KST 03:00(UTC 18:00) — 상품분류 매핑은 자주 안 바뀌므로 하루 1번만
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
          - hour-backfill
          - patch
          - product-patch
          - product-backfill
          - channel-backfill
          - product-category
          - menu-build
          - debug
          - debug-order
          - compare
          - product-compare
          - debug-channel-fields
          - debug-settled-channel-fields
          - debug-settled-channel-filter
      menu_months:
        description: 'menu-build 모드일 때 다시 만들 월 (yyyymm, 콤마구분 예: 202610 또는 202609,202610 — 비우면 이번 달(월초 1~3일엔 지난달 포함))'
        required: false
        default: ''
      rolling_days:
        description: 'backfill 모드일 때 조회할 일수'
        required: false
        default: '90'
      product_rolling_days:
        description: 'product-backfill 모드일 때 조회할 일수 (용량 문제로 기본 90일 권장)'
        required: false
        default: '90'
      hour_backfill_start:
        description: 'hour-backfill 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      hour_backfill_end:
        description: 'hour-backfill 모드일 때 종료일 (yyyymmdd, 시작일보다 빠를 수 없음)'
        required: false
        default: ''
      hour_backfill_store_codes:
        description: 'hour-backfill 모드일 때 대상 매장코드 (콤마구분, 비우면 전체 매장)'
        required: false
        default: ''
      hour_backfill_chain_depth:
        description: '(자동) hour-backfill 조기종료 후 자동 재실행 시 내부적으로 쓰이는 체인 깊이 — 직접 실행할 땐 비워두세요'
        required: false
        default: '0'
      patch_store_codes:
        description: 'patch 모드일 때 대상 매장코드 (콤마구분, 예: BHD106,BHD087)'
        required: false
        default: ''
      patch_start:
        description: 'patch 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      patch_end:
        description: 'patch 모드일 때 종료일 (yyyymmdd)'
        required: false
        default: ''
      channel_backfill_shop_no:
        description: 'channel-backfill 모드일 때 대상 매장코드 (예: BHD055)'
        required: false
        default: ''
      channel_backfill_start:
        description: 'channel-backfill 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      channel_backfill_end:
        description: 'channel-backfill 모드일 때 종료일 (yyyymmdd)'
        required: false
        default: ''
      debug_shop_no:
        description: 'debug/compare 모드일 때 테스트할 매장코드'
        required: false
        default: 'BHD055'
      debug_days:
        description: 'debug 모드일 때 조회할 일수 (범위 제한 테스트용)'
        required: false
        default: '7'
      debug_date:
        description: 'compare 모드일 때 비교할 날짜 (yyyymmdd, 정산 끝난 과거 날짜 권장)'
        required: false
        default: ''
      debug_store_names:
        description: 'debug-order 모드일 때 매장명 여러 개 지정 (콤마구분, 비워두면 debug_shop_no 1개만 사용)'
        required: false
        default: ''
      debug_settled_start:
        description: 'debug-settled-channel-fields 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      debug_settled_end:
        description: 'debug-settled-channel-fields/debug-settled-channel-filter 모드일 때 종료일 (yyyymmdd, 비우면 시작일과 동일)'
        required: false
        default: ''
      debug_ifsa_tp:
        description: 'debug-settled-channel-filter 모드일 때 필터할 IFSA_TP 코드 (예: OKB, 비우면 필터 없이 baseline 조회)'
        required: false
        default: ''
      debug_sda_tp:
        description: 'debug-settled-channel-filter 모드일 때 필터할 SDA_TP 값 (예: IFS, 필요할 때만)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  # [2026-08-26 변경] 기존에는 mode별로 그룹이 나뉘어 있어(tpay-sync-daily,
  # tpay-sync-product-backfill 등) daily 스케줄과 수동 backfill류가 동시에 실행될 수
  # 있었다. product-backfill.js는 data/product-daily.json을 부분 병합이 아니라
  # 통째로 덮어쓰기 때문에, 실행 도중(수십분~몇 시간) product-daily-update.js가
  # 10분마다 반영한 "오늘자" 갱신분이 backfill 종료 시점에 통째로 사라질 위험이 있었다.
  # 그룹을 mode 구분 없이 하나로 묶어서 daily/backfill/patch 등 모든 실행이 겹치지
  # 않고 순서대로만 돌도록 한다(cancel-in-progress: false라서 취소가 아니라 대기).
  group: tpay-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Git bash 경로 등록 (윈도우 PC 실행기용 — 서비스 계정 PATH에 bash가 없어서)
        # 이후 단계(shell: bash)가 Git에 포함된 bash를 찾을 수 있게 C:\Program Files\Git\bin 을
        # PATH에 추가한다 (GITHUB_PATH는 다음 단계부터 적용됨).
        # PowerShell은 PC의 스크립트 실행 정책(Restricted)에 막히므로 cmd로 실행.
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" (echo Git bash not found - install Git for Windows & exit /b 1)
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          echo Added to PATH: C:\Program Files\Git\bin
      - name: 이전 실행에서 꼬인 git 상태 정리 (PC 실행기는 작업폴더가 남아 있어서)
        # 예전 'git pull --rebase'가 충돌로 멈추면 .git/rebase-merge 가 남아,
        # 이후 모든 실행의 커밋/푸시가 'already a rebase-merge directory'로 조용히 실패했다.
        run: |
          if [ -d .git ]; then
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            rm -rf .git/rebase-merge .git/rebase-apply .git/index.lock
            echo "git 상태 정리 완료"
          else
            echo "작업폴더에 .git 없음 — 정리할 것 없음"
          fi
      - name: 이 PC의 공인 IP 확인 (T-PAY는 해외·클라우드 IP를 막으므로 진단용)
        continue-on-error: true
        run: |
          IP=$(curl -s --max-time 10 https://api.ipify.org || echo "확인 실패")
          echo "이 실행기의 공인 IP: $IP"
          curl -s --max-time 10 "https://ipinfo.io/$IP/json" | grep -E '"(city|region|country|org)"' || true
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # 대기열에 있던 실행도 '실행 시작 시점'의 최신 main을 받도록 (예전 커밋 기준으로 덮어쓰기 방지)
          ref: main
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/daily-update.js
      - name: 상품별 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-daily-update.js
      - name: 시간대별 매출 갱신 실행 (스케줄 or 수동-daily, API 호출 없이 위 daily-update.js 결과 재사용)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        run: node scripts/hour-update.js
      - name: 메뉴 월별 파일 갱신 (스케줄 or 수동-daily/menu-build, 위 product-daily.json 결과 재사용 — API 호출 없음)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily' || github.event.inputs.mode == 'menu-build'
        continue-on-error: true   # 메뉴 집계가 실패해도 매출/상품 데이터 커밋은 막지 않는다
        env:
          MENU_MONTHS: ${{ github.event.inputs.menu_months }}
        run: node scripts/menu-update.js
      - name: 지난 날짜 자동 채우기 (하루 1번, 오늘자 갱신이 끝난 뒤 실행 — 먼저 돌면 호출이 몰려 오늘자가 0건으로 받아짐, PC가 꺼져 있던 동안 빠진 날짜 재조회 — 이미 했으면 바로 건너뜀)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/catchup.js
      - name: 상품분류 매핑 갱신 (매일 1회 스케줄 or 수동-product-category)
        if: github.event.schedule == '0 18 * * *' || github.event.inputs.mode == 'product-category'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-category.js
      - name: 백필 실행 (수동-backfill)
        if: github.event.inputs.mode == 'backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          ROLLING_DAYS: ${{ github.event.inputs.rolling_days }}
        run: node scripts/backfill.js
      - name: 상품별 백필 실행 (수동-product-backfill)
        if: github.event.inputs.mode == 'product-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          PRODUCT_ROLLING_DAYS: ${{ github.event.inputs.product_rolling_days }}
        run: node scripts/product-backfill.js
      - name: 시간대별 매출 백필 실행 (수동-hour-backfill, 지정 구간을 하루씩 조회해 월별 파일에 저장)
        id: hour_backfill
        if: github.event.inputs.mode == 'hour-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          HOUR_BACKFILL_START: ${{ github.event.inputs.hour_backfill_start }}
          HOUR_BACKFILL_END: ${{ github.event.inputs.hour_backfill_end }}
          HOUR_BACKFILL_STORE_CODES: ${{ github.event.inputs.hour_backfill_store_codes }}
          HOUR_BACKFILL_CHAIN_DEPTH: ${{ github.event.inputs.hour_backfill_chain_depth }}
        run: node scripts/hour-backfill.js
      - name: 채널별 매출 백필 실행 (수동-channel-backfill)
        if: github.event.inputs.mode == 'channel-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          BACKFILL_SHOP_NO: ${{ github.event.inputs.channel_backfill_shop_no }}
          BACKFILL_START: ${{ github.event.inputs.channel_backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.channel_backfill_end }}
        run: node scripts/backfill-channel-sales.js
      - name: 특정 매장·구간 패치 실행 (수동-patch, 기존 데이터는 유지하고 지정 구간만 재조회+병합)
        if: github.event.inputs.mode == 'patch'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          STORE_CODES: ${{ github.event.inputs.patch_store_codes }}
          START: ${{ github.event.inputs.patch_start }}
          END: ${{ github.event.inputs.patch_end }}
        run: node scripts/patch-missing-days.js
      - name: 특정 매장·구간 상품별 패치 실행 (수동-product-patch, 기존 상품 데이터는 유지하고 지정 구간만 재조회+병합)
        if: github.event.inputs.mode == 'product-patch'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          STORE_CODES: ${{ github.event.inputs.patch_store_codes }}
          START: ${{ github.event.inputs.patch_start }}
          END: ${{ github.event.inputs.patch_end }}
        run: node scripts/product-patch.js
      - name: 진단 실행 (수동-debug, 원본 응답 확인용)
        if: github.event.inputs.mode == 'debug'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DAYS: ${{ github.event.inputs.debug_days }}
        run: node scripts/debug-single-store.js
      - name: 주문-품목 매칭 진단 실행 (수동-debug-order, SA_NO ↔ SC_NO 매칭 검증)
        if: github.event.inputs.mode == 'debug-order'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
          DEBUG_STORE_NAMES: ${{ github.event.inputs.debug_store_names }}
        run: node scripts/debug-order-detail.js
      - name: 실시간 소스 검증 실행 (수동-compare, REQ_CODE 3 vs 4 비교)
        if: github.event.inputs.mode == 'compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-realtime-compare.js
      - name: 상품별 실시간 소스 검증 실행 (수동-product-compare, REQ_CODE 5 vs 6 비교)
        if: github.event.inputs.mode == 'product-compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/product-realtime-compare.js
      - name: 채널 필드 진단 실행 (수동-debug-channel-fields, 배민/쿠팡이츠 등 채널명 필드 탐색용)
        if: github.event.inputs.mode == 'debug-channel-fields'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-channel-fields.js
      - name: 정산확정 채널 필드 진단 실행 (수동-debug-settled-channel-fields, REQ_CODE 4 원본에 채널필드 있는지 확인용)
        if: github.event.inputs.mode == 'debug-settled-channel-fields'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_START: ${{ github.event.inputs.debug_settled_start }}
          DEBUG_END: ${{ github.event.inputs.debug_settled_end }}
        run: node scripts/debug-settled-channel-fields.js
      - name: 정산확정 채널 필터 진단 실행 (수동-debug-settled-channel-filter, REQ_CODE 4에 IFSA_TP 필터가 실제로 먹히는지 확인용)
        if: github.event.inputs.mode == 'debug-settled-channel-filter'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_START: ${{ github.event.inputs.debug_settled_start }}
          DEBUG_END: ${{ github.event.inputs.debug_settled_end }}
          DEBUG_IFSA_TP: ${{ github.event.inputs.debug_ifsa_tp }}
          DEBUG_SDA_TP: ${{ github.event.inputs.debug_sda_tp }}
        run: node scripts/debug-settled-channel-filter.js
      - name: 변경사항 커밋 & 푸시
        if: github.event.inputs.mode != 'debug' && github.event.inputs.mode != 'debug-order' && github.event.inputs.mode != 'compare' && github.event.inputs.mode != 'product-compare' && github.event.inputs.mode != 'debug-channel-fields' && github.event.inputs.mode != 'debug-settled-channel-fields' && github.event.inputs.mode != 'debug-settled-channel-filter'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 이번 실행이 만든 데이터 파일만 따로 보관 → 최신 main으로 맞춘 뒤 다시 덮어써서 커밋.
          # (JSON 데이터를 rebase로 합치면 충돌이 나서 멈추는 문제가 있었음 — 실행은 한 번에 하나씩만
          #  돌고 매번 최신 main에서 시작하므로, 이번 결과로 덮어쓰는 게 맞다)
          collect_files() {
            for f in data/live-daily.json data/product-daily.json data/receipt-today.json data/catchup-state.json data/product-category.json data/menu-*.json data/hour/*.json; do
              [ -f "$f" ] && echo "$f"
            done
          }
          BK="$RUNNER_TEMP/tpay-data-backup"
          ok=0
          for i in 1 2 3 4 5; do
            rm -rf "$BK"; mkdir -p "$BK"
            collect_files | while read -r f; do mkdir -p "$BK/$(dirname "$f")"; cp "$f" "$BK/$f"; done
            git fetch origin main || { echo "fetch 실패, 재시도 ($i/5)"; sleep 10; continue; }
            git reset --hard origin/main
            cp -r "$BK/data/." data/
            collect_files | xargs git add
            if git diff --cached --quiet; then
              echo "변경 없음, 커밋 생략"; ok=1; break
            fi
            git commit -q -m "chore: tpay 매출 데이터 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            if git push origin HEAD:main; then ok=1; echo "✅ 푸시 완료"; break; fi
            echo "푸시 실패, 재시도 ($i/5)..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::데이터 커밋/푸시에 5번 모두 실패했습니다 — 현황판에 반영되지 않았어요"
            exit 1
          fi
      - name: 백필 조기 종료 시 다음 구간 자동 이어받기 (수동-hour-backfill)
        if: github.event.inputs.mode == 'hour-backfill' && steps.hour_backfill.outputs.continue_start != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "다음 구간을 새 workflow_dispatch로 자동 재실행합니다: ${{ steps.hour_backfill.outputs.continue_start }} ~ ${{ steps.hour_backfill.outputs.continue_end }} (체인 ${{ steps.hour_backfill.outputs.continue_depth }})"
          gh workflow run tpay-sync.yml \
            -f mode=hour-backfill \
            -f hour_backfill_start=${{ steps.hour_backfill.outputs.continue_start }} \
            -f hour_backfill_end=${{ steps.hour_backfill.outputs.continue_end }} \
            -f hour_backfill_store_codes="${{ github.event.inputs.hour_backfill_store_codes }}" \
            -f hour_backfill_chain_depth=${{ steps.hour_backfill.outputs.continue_depth }}
