name: tpay 매출 데이터 동기화
on:
  schedule:
    - cron: '0 18 * * *'   # 매일 KST 03:00(UTC 18:00) — 상품분류 매핑은 자주 안 바뀌므로 하루 1번만
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - backfill
          - patch
          - product-backfill
          - channel-backfill
          - product-category
          - debug
          - debug-order
          - compare
          - product-compare
          - debug-channel-fields
      rolling_days:
        description: 'backfill 모드일 때 조회할 일수'
        required: false
        default: '90'
      product_rolling_days:
        description: 'product-backfill 모드일 때 조회할 일수 (용량 문제로 기본 90일 권장)'
        required: false
        default: '90'
      patch_store_codes:
        description: 'patch 모드일 때 대상 매장코드 (콤마구분, 예: BHD106,BHD087)'
        required: false
        default: ''
      patch_start:
        description: 'patch 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      patch_end:
        description: 'patch 모드일 때 종료일 (yyyymmdd)'
        required: false
        default: ''
      channel_backfill_shop_no:
        description: 'channel-backfill 모드일 때 대상 매장코드 (예: BHD055)'
        required: false
        default: ''
      channel_backfill_start:
        description: 'channel-backfill 모드일 때 시작일 (yyyymmdd)'
        required: false
        default: ''
      channel_backfill_end:
        description: 'channel-backfill 모드일 때 종료일 (yyyymmdd)'
        required: false
        default: ''
      debug_shop_no:
        description: 'debug/compare 모드일 때 테스트할 매장코드'
        required: false
        default: 'BHD055'
      debug_days:
        description: 'debug 모드일 때 조회할 일수 (범위 제한 테스트용)'
        required: false
        default: '7'
      debug_date:
        description: 'compare 모드일 때 비교할 날짜 (yyyymmdd, 정산 끝난 과거 날짜 권장)'
        required: false
        default: ''
      debug_store_names:
        description: 'debug-order 모드일 때 매장명 여러 개 지정 (콤마구분, 비워두면 debug_shop_no 1개만 사용)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  # [2026-08-26 변경] 기존에는 mode별로 그룹이 나뉘어 있어(tpay-sync-daily,
  # tpay-sync-product-backfill 등) daily 스케줄과 수동 backfill류가 동시에 실행될 수
  # 있었다. product-backfill.js는 data/product-daily.json을 부분 병합이 아니라
  # 통째로 덮어쓰기 때문에, 실행 도중(수십분~몇 시간) product-daily-update.js가
  # 10분마다 반영한 "오늘자" 갱신분이 backfill 종료 시점에 통째로 사라질 위험이 있었다.
  # 그룹을 mode 구분 없이 하나로 묶어서 daily/backfill/patch 등 모든 실행이 겹치지
  # 않고 순서대로만 돌도록 한다(cancel-in-progress: false라서 취소가 아니라 대기).
  group: tpay-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/daily-update.js
      - name: 상품별 일일 갱신 실행 (스케줄 or 수동-daily)
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'daily'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-daily-update.js
      - name: 상품분류 매핑 갱신 (매일 1회 스케줄 or 수동-product-category)
        if: github.event.schedule == '0 18 * * *' || github.event.inputs.mode == 'product-category'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
        run: node scripts/product-category.js
      - name: 백필 실행 (수동-backfill)
        if: github.event.inputs.mode == 'backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          ROLLING_DAYS: ${{ github.event.inputs.rolling_days }}
        run: node scripts/backfill.js
      - name: 상품별 백필 실행 (수동-product-backfill)
        if: github.event.inputs.mode == 'product-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          PRODUCT_ROLLING_DAYS: ${{ github.event.inputs.product_rolling_days }}
        run: node scripts/product-backfill.js
      - name: 채널별 매출 백필 실행 (수동-channel-backfill)
        if: github.event.inputs.mode == 'channel-backfill'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          BACKFILL_SHOP_NO: ${{ github.event.inputs.channel_backfill_shop_no }}
          BACKFILL_START: ${{ github.event.inputs.channel_backfill_start }}
          BACKFILL_END: ${{ github.event.inputs.channel_backfill_end }}
        run: node scripts/backfill-channel-sales.js
      - name: 특정 매장·구간 패치 실행 (수동-patch, 기존 데이터는 유지하고 지정 구간만 재조회+병합)
        if: github.event.inputs.mode == 'patch'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          STORE_CODES: ${{ github.event.inputs.patch_store_codes }}
          START: ${{ github.event.inputs.patch_start }}
          END: ${{ github.event.inputs.patch_end }}
        run: node scripts/patch-missing-days.js
      - name: 진단 실행 (수동-debug, 원본 응답 확인용)
        if: github.event.inputs.mode == 'debug'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DAYS: ${{ github.event.inputs.debug_days }}
        run: node scripts/debug-single-store.js
      - name: 주문-품목 매칭 진단 실행 (수동-debug-order, SA_NO ↔ SC_NO 매칭 검증)
        if: github.event.inputs.mode == 'debug-order'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
          DEBUG_STORE_NAMES: ${{ github.event.inputs.debug_store_names }}
        run: node scripts/debug-order-detail.js
      - name: 실시간 소스 검증 실행 (수동-compare, REQ_CODE 3 vs 4 비교)
        if: github.event.inputs.mode == 'compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-realtime-compare.js
      - name: 상품별 실시간 소스 검증 실행 (수동-product-compare, REQ_CODE 5 vs 6 비교)
        if: github.event.inputs.mode == 'product-compare'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/product-realtime-compare.js
      - name: 채널 필드 진단 실행 (수동-debug-channel-fields, 배민/쿠팡이츠 등 채널명 필드 탐색용)
        if: github.event.inputs.mode == 'debug-channel-fields'
        env:
          TPAY_TOKEN: ${{ secrets.TPAY_TOKEN }}
          DEBUG_SHOP_NO: ${{ github.event.inputs.debug_shop_no }}
          DEBUG_DATE: ${{ github.event.inputs.debug_date }}
        run: node scripts/debug-channel-fields.js
      - name: 변경사항 커밋 & 푸시
        if: github.event.inputs.mode != 'debug' && github.event.inputs.mode != 'debug-order' && github.event.inputs.mode != 'compare' && github.event.inputs.mode != 'product-compare' && github.event.inputs.mode != 'debug-channel-fields'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-daily.json data/product-daily.json data/receipt-today.json
          if [ -f data/product-category.json ]; then git add data/product-category.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음, 커밋 생략"
          else
            git commit -m "chore: tpay 매출 데이터 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "푸시 실패, 재시도 ($i/3)..."
              sleep 5
            done
          fi
